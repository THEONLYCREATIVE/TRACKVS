
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Tracker Pro UAE/KWD — by Vysakh</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=DM+Sans:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #4FC3F7; --tealD: #0277BD; 
            --amber: #FFB74D; 
            --aura-bg: #C2185B; /* Solid pink/magenta from image.png */
            --bg: #0A0F5A; --card: rgba(255,255,255,.07); --border: rgba(255,255,255,.12);
            --t1: #F2F2F2; --t2: #C8D0E8; --t3: #8892B8; --t4: #5A6490;
            --sh: 0 4px 20px rgba(0,0,0,.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--t1); overflow: hidden; height: 100dvh; }
        #app { height: 100%; display: flex; flex-direction: column; }
        .main { flex: 1; overflow-y: auto; padding-bottom: 100px; }

        .hdr { padding: max(15px, env(safe-area-inset-top)) 20px 10px; background: var(--bg); }
        .headline { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; }
        .headline span { color: var(--amber); }
        
        /* Top KPI Strip */
        .kpi-strip { 
            display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; 
            background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .kpi-strip::-webkit-scrollbar { display: none; }
        .kpi-pill { 
            background: var(--card); border: 1px solid var(--border); padding: 8px 12px; 
            border-radius: 12px; flex-shrink: 0;
        }
        .kpi-pill-l { font-size: 9px; font-weight: 700; color: var(--t3); text-transform: uppercase; margin-bottom: 2px; }
        .kpi-pill-v { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--teal); }
        .kwd-tag { font-size: 9px; color: var(--amber); margin-left: 4px; font-weight: 800; }

        /* Grid System */
        .grid-compact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px 20px; }
        .entry-card { 
            background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; 
            padding: 15px 12px; transition: 0.1s; position: relative;
        }
        
        /* Aura Card - Filled as per image.png */
        .aura-grid { 
            background: linear-gradient(180deg, #D81B60 0%, #AD1457 100%) !important; 
            border: none !important;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
        }
        .aura-grid .entry-label, .aura-grid .entry-val, .aura-grid .entry-kwd { 
            color: #FFFFFF !important; 
        }

        .entry-card:active { transform: scale(0.96); opacity: 0.8; }
        .entry-icon { font-size: 20px; margin-bottom: 6px; }
        .entry-label { font-size: 11px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: 0.5px; }
        .entry-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; margin-top: 2px; color: #fff; }
        .entry-kwd { font-size: 11px; color: var(--amber); font-weight: 700; margin-top: 3px; display: block; }

        /* Calculator Modal */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; align-items: flex-end; z-index: 1000; 
        }
        .modal.show { display: flex; }
        .modal-content { 
            background: #08104D; width: 100%; border-radius: 32px 32px 0 0; 
            padding: 20px 24px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border);
        }
        .calc-display { 
            background: rgba(0,0,0,0.4); border-radius: 18px; padding: 20px; margin-bottom: 20px;
            text-align: right; border: 1px solid var(--border);
        }
        .calc-formula { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--t4); min-height: 1.2em; margin-bottom: 4px; }
        .calc-main { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; color: #fff; }
        
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .calc-btn { 
            height: 60px; border-radius: 16px; background: var(--card); color: #fff;
            font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center;
        }
        .calc-btn.op { background: var(--tealD); }
        .calc-btn.eq { background: var(--aura-bg); grid-column: span 2; }

        .btn-save { 
            background: linear-gradient(135deg, var(--teal), var(--tealD));
            margin: 15px 20px; padding: 18px; border-radius: 18px; color: #fff;
            font-weight: 800; text-align: center; font-size: 16px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="hdr">
        <div class="headline">Boots <span>Performance</span></div>
    </div>

    <div class="kpi-strip">
        <div class="kpi-pill"><div class="kpi-pill-l">ATV</div><div class="kpi-pill-v"><span id="k-atv">0.00</span><span class="kwd-tag" id="k-atv-kwd">0.0 KWD</span></div></div>
        <div class="kpi-pill"><div class="kpi-pill-l">No7 Share</div><div class="kpi-pill-v" id="k-no7">0.0%</div></div>
        <div class="kpi-pill"><div class="kpi-pill-l">IPC</div><div class="kpi-pill-v" id="k-ipc">0.00</div></div>
        <div class="kpi-pill"><div class="kpi-pill-l">CVR</div><div class="kpi-pill-v" id="k-cvr">0.0%</div></div>
    </div>

    <div class="main">
        <div class="grid-compact" id="input-grid"></div>
        <div class="btn-save" onclick="saveData()">✓ FINISH & SAVE REPORT</div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="calc-modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
            <h3 id="modal-title" style="font-family:'Playfair Display'; color:var(--teal)">Entry</h3>
            <button onclick="closeModal()" style="color:var(--t4); background:none; border:none; font-size:24px">✕</button>
        </div>
        <div class="calc-display">
            <div class="calc-formula" id="calc-formula"></div>
            <div class="calc-main" id="calc-main">0</div>
        </div>
        <div class="calc-grid">
            <div class="calc-btn" onclick="press('7')">7</div><div class="calc-btn" onclick="press('8')">8</div><div class="calc-btn" onclick="press('9')">9</div><div class="calc-btn op" onclick="press('-')">-</div>
            <div class="calc-btn" onclick="press('4')">4</div><div class="calc-btn" onclick="press('5')">5</div><div class="calc-btn" onclick="press('6')">6</div><div class="calc-btn op" onclick="press('+')">+</div>
            <div class="calc-btn" onclick="press('1')">1</div><div class="calc-btn" onclick="press('2')">2</div><div class="calc-btn" onclick="press('3')">3</div><div class="calc-btn op" onclick="press('C')">C</div>
            <div class="calc-btn" onclick="press('0')">0</div><div class="calc-btn" onclick="press('.')">.</div><div class="calc-btn eq" onclick="press('=')">SAVE (=)</div>
        </div>
    </div>
</div>

<script>
    let currentKey = '';
    let formula = '';
    let data = { totalAED: 0, trn: 0, no7AED: 0, totalItems: 0, footfall: 0, auraTrn: 0 };

    const FIELDS = [
        { key: 'totalAED', label: 'Total Sales', icon: '💰', kwd: true },
        { key: 'no7AED', label: 'No7 Sales', icon: '💎', kwd: true },
        { key: 'trn', label: 'Transactions', icon: '🧾' },
        { key: 'totalItems', label: 'Units Sold', icon: '📦' },
        { key: 'footfall', label: 'Footfall', icon: '👣' },
        { key: 'auraTrn', label: 'Aura Enrolled', icon: '✨', isAura: true }
    ];

    function renderGrid() {
        let html = '';
        FIELDS.forEach(f => {
            const val = data[f.key] || 0;
            html += `
                <div class="entry-card ${f.isAura ? 'aura-grid' : ''}" onclick="openModal('${f.key}', '${f.label}')">
                    <div class="entry-icon">${f.icon}</div>
                    <div class="entry-label">${f.label}</div>
                    <div class="entry-val">${Number(val).toLocaleString()}</div>
                    ${f.kwd ? `<span class="entry-kwd">${(val / 12).toFixed(2)} KWD</span>` : ''}
                </div>
            `;
        });

        const auraPct = data.trn > 0 ? ((data.auraTrn / data.trn) * 100).toFixed(1) : '0.0';
        html += `
            <div class="entry-card aura-grid">
                <div class="entry-icon">📊</div>
                <div class="entry-label">Aura Rate</div>
                <div class="entry-val">${auraPct}%</div>
            </div>
        `;
        document.getElementById('input-grid').innerHTML = html;
        updateKPIs();
    }

    function updateKPIs() {
        const atv = data.trn > 0 ? (data.totalAED / data.trn) : 0;
        document.getElementById('k-atv').innerText = atv.toFixed(2);
        document.getElementById('k-atv-kwd').innerText = (atv / 12).toFixed(2) + " KWD";
        document.getElementById('k-ipc').innerText = data.trn > 0 ? (data.totalItems / data.trn).toFixed(2) : '0.00';
        document.getElementById('k-cvr').innerText = data.footfall > 0 ? ((data.trn / data.footfall) * 100).toFixed(1) + '%' : '0.0%';
        document.getElementById('k-no7').innerText = data.totalAED > 0 ? ((data.no7AED / data.totalAED) * 100).toFixed(1) + '%' : '0.0%';
    }

    function openModal(key, label) {
        currentKey = key;
        formula = data[key] ? data[key].toString() : '';
        document.getElementById('modal-title').innerText = label;
        document.getElementById('calc-main').innerText = formula || '0';
        document.getElementById('calc-formula').innerText = '';
        document.getElementById('calc-modal').classList.add('show');
    }

    function closeModal() { document.getElementById('calc-modal').classList.remove('show'); }

    function press(val) {
        const main = document.getElementById('calc-main');
        const formDisp = document.getElementById('calc-formula');
        if (val === 'C') { formula = ''; main.innerText = '0'; formDisp.innerText = ''; }
        else if (val === '=') {
            try {
                data[currentKey] = parseFloat(eval(formula).toFixed(2)) || 0;
                renderGrid(); closeModal();
            } catch (e) { main.innerText = 'Error'; formula = ''; }
        } else {
            formula += val; main.innerText = formula;
            try { let temp = eval(formula.replace(/[+\-]$/, "")); formDisp.innerText = temp !== undefined ? "= " + temp : ""; } catch(e) {}
        }
    }

    function saveData() { alert("Report Saved!"); }
    renderGrid();
</script>
</body>
</html>
